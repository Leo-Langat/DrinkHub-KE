<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="background-color" content="#090d16" />
    <meta name="description" content="DrinkHub Kenya - Multi-tenant Venue Ordering, Kitchen Dispatch & M-Pesa Realtime Payments PWA" />

    <!-- Apple iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DrinkHub KE" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>DrinkHub Kenya | Realtime QR Venue Ordering & M-Pesa PWA</title>
  </head>
  <body class="bg-dark-950 text-slate-100 antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker for App Shell Caching in Production -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('[PWA] Service Worker registered successfully:', reg.scope);
          }).catch((err) => {
            console.warn('[PWA] SW Registration:', err);
          });
        });
      }
    </script>
  </body>
</html>
